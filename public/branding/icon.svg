<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1a2b"/>
      <stop offset="1" stop-color="#0a1626"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9ccc1f"/>
      <stop offset="1" stop-color="#6ea60f"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- Green diagonal field on the right -->
  <path d="M512 0 L512 512 L300 512 L430 0 Z" fill="url(#green)" opacity="0.9"/>
  <path d="M512 0 L512 512 L360 512 L470 0 Z" fill="#0a1626" opacity="0.18"/>

  <!-- Swoosh arc -->
  <path d="M120 300 A150 150 0 1 1 400 210" fill="none" stroke="url(#green)" stroke-width="26" stroke-linecap="round"/>

  <!-- Monogram TG -->
  <g font-family="Arial, Helvetica, sans-serif" font-weight="900">
    <text x="196" y="322" font-size="300" fill="#ffffff" text-anchor="middle" letter-spacing="-6">T</text>
    <text x="330" y="322" font-size="270" fill="url(#green)" text-anchor="middle">G</text>
  </g>

  <!-- Wordmark -->
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="256" y="418" font-size="82" font-weight="900" fill="#ffffff" letter-spacing="4">TURF</text>
    <text x="256" y="474" font-size="52" font-weight="800" fill="url(#green)" letter-spacing="10">GILT</text>
  </g>
</svg>
